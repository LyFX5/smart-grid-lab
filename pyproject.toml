[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart_grid_lab"
version = "0.1.0"
description = "An interactive digital twin platform for microgrids."
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "The Smart Grid Lab Authors"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering"
]
dependencies = [
    "numpy>=1.20",
    "pandas>=1.3",
    "scipy>=1.7"
]
requires-python = ">=3.8"

[project.optional-dependencies]
ui = [
    "dash>=2.14",
    "plotly>=5",
]

[project.urls]
Homepage = "https://github.com/LyFX5/smart-grid-lab"
Repository = "https://github.com/LyFX5/smart-grid-lab"
